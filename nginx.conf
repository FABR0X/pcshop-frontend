#
# nginx config for the SPA.
#
# Two jobs: serve the built files, and make /api a same-origin path by proxying
# it to the backend. That second part is what lets the browser use a relative
# base URL and means no CORS preflight on any call.
#

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The client sets Authorization, Content-Type and Accept. Anything else in a
    # cross-origin preflight is a sign something unexpected is calling in.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ---- API ------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Login does a synchronous LDAP bind, so allow more than the 60s default
        # before giving up on a slow directory.
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    # ---- Hashed build assets --------------------------------------------
    # Filenames contain a content hash, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- Entry point -----------------------------------------------------
    # Never cached: a stale index.html points at hashed assets that no longer
    # exist, which is the classic hard-refresh-can't-fix-it deploy bug.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing: /login and /products/new are React routes with no file
    # behind them, so every unmatched path falls back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
